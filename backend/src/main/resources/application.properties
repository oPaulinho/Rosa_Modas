# ============================================================
# Configuração do backend (Spring Boot)
#
# As credenciais do banco NÃO ficam fixas no código.
# Em produção (Render), defina as variáveis de ambiente:
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
#   ADMIN_EMAIL, ADMIN_PASSWORD
# Os valores após ":" são apenas o fallback local de desenvolvimento.
# ============================================================
spring.application.name=backend
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rosa_modas_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
# Configuração WhatsApp (Notificações de Agendamento)
#
# Provedores suportados: evolution, twilio, zapi, wppconnect
# Configure as variáveis de ambiente correspondentes no deploy.
# Exemplo Evolution API:
#   WHATSAPP_PROVIDER=evolution
#   WHATSAPP_API_URL=https://sua-evolution-api.com
#   WHATSAPP_API_KEY=sua-chave-api
#   WHATSAPP_INSTANCE_ID=nome-da-instancia
# ============================================================
whatsapp.provider=${WHATSAPP_PROVIDER:}
whatsapp.api-url=${WHATSAPP_API_URL:}
whatsapp.api-key=${WHATSAPP_API_KEY:}
whatsapp.instance-id=${WHATSAPP_INSTANCE_ID:}
whatsapp.instance-token=${WHATSAPP_INSTANCE_TOKEN:}
whatsapp.from-number=${WHATSAPP_FROM_NUMBER:}